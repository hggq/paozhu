# 支付宝（公钥模式，非证书模式）
# key_file        应用私钥
# public_key_file 支付宝公钥
# api_aes         接口内容加密密钥（当前未启用，填后台那串即可）
# sandbox         1=沙箱 0=正式
# 密钥文件写法：文件路径 / PEM 文本 / 裸 base64，三选一
# 只换磁盘上的密钥文件内容不用重启；改本文件要重启 bin/paozhu
[alipay]
appid = 2022004364796847
key_file = conf/应用私钥RSA2048.txt
public_key_file = conf/alipayPublicKey_RSA2.txt
api_aes = NWMglaGc49totbyaqa3H8Q==
notifyurl = https://www.xxx.net/alipaynotify
returnurl = https://www.xxx.net/alipayreturn
sandbox = 0

# ===== 多域名多商户 =====
# [domains] 键=请求 Host（小写、已剥端口），值=商户段前缀 tag
# 段名规则：[<tag>.<kind>]，kind = wxpayv2 / wxpayv3 / wxpayv3_web / alipay
# 无 tag 或段不存在 → 软回落到裸段（[wxpayv3] / [alipay] 等）
#
# ⚠️ 当前业务路由用哪个 tag 由代码硬编码（各 controller 里的 kPayTag），
# Host → tag 映射只作诊断页读数，不切收款方
#
# 改本文件要重启 bin/paozhu
[domains]
www.site-a.com = sitea

[sitea.alipay]
appid = xxx-sitea-alipay-appid
key_file = conf/sitea应用私钥RSA2048.txt
public_key_file = conf/sitea支付宝公钥RSA2.txt
notifyurl = https://www.site-a.com/alipaynotify
returnurl = https://www.site-a.com/alipayreturn
sandbox = 0

[sitea.wxpayv3]
appid = xxx-sitea-wechat-appid
mch_id = xxx-sitea-mchid
api_v3_key = xxx-sitea-apiv3-key-32chars-xxxxx
cert_file = conf/sitea_apiclient_cert.pem
key_file = conf/sitea_apiclient_key.pem
notifyurl = https://www.site-a.com/ordernotify
v3_serial_no =
platform_cert_file =
