; Socket 长连接客户端配置
; 裸 TCP 出站没有独立端口：server 在 httpport 上按首字节嗅探（"tcp " 前缀走 socket handler），
; 所以 port 要跟 server.conf 的 httpport 一致；isssl/sslport/insecure/ca_file/sni 目前加载代码不读。
; url = server 端 sockets_method_reg.hpp 里注册的 handler 名；带不带开头的 '/' 都行，
;       两侧都统一成带 '/' 的形状再匹配（和 HTTP 路径一个习惯）

[default]
; enable = 0 这一段名下的常驻裸 TCP 客户端循环整段不启动（同步版与协程版共用本段，一起关）。
; 只在进程启动时读一次，改完要重启；键缺失按 1 处理。
enable   = 1
host    = 127.0.0.1
port    = 80          ; = server.conf httpport，裸 TCP 握手复用它
url     = /mytestsocket
isssl   = 0
sslport = 0
insecure = 0
ca_file =
sni     =
timeout = 10

groupid =
myid    =