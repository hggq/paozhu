[default]
type     = main
host     = 127.0.0.1
port     = 3306
dbname   = hello_world
user     = benchmarkdbuser
password = benchmarkdbpass
pretable = 
maxpool  = 5
dbtype   = mysql
charset  = utf8mb4
#ssl=ON
#sslverify=ON                    ; Verify the certificate chain 校验证书链（配合系统 CA / SSL_CERT_FILE）
#sslhost=db.example.com          ; Certificate domain (SNI + hostname check); when empty both fall back to host. SNI is always sent regardless of sslverify; the hostname check only runs when sslverify=ON 证书域名（SNI + 域名校验），为空则两者都用 host 兜底；域名校验只在 sslverify=ON 时执行

type     = second
host     = 127.0.0.1
port     = 3306
dbname   = hello_world
user     = benchmarkdbuser
password = benchmarkdbpass
pretable = 
maxpool  = 20
dbtype   = mysql
charset  = utf8mb4
#ssl=ON
#sslverify=ON
#sslhost=db.example.com

