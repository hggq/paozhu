; [demo] 不是常驻客户端的连接段，是 /start_mqtt_loop、/test_mqtt_client、/test_mqtt_tick_push*
; 这几条演示路由要连的 broker 地址（默认就是本进程自己的 httpport）。
; 段缺失时它们退回 127.0.0.1:80 并打一行日志。
[demo]
host     = 127.0.0.1
port     = 80

; enable = 0 该段名下的常驻 MQTT 客户端循环不启动。
; 只在进程启动时读一次，改完要重启；键缺失按 1 处理。
[echo_sync]
enable   = 1
host     = 127.0.0.1
port     = 80
clientid = mydevice@@@group-echo-sync
username =
password =
keepalive = 60
timeout  = 10

[echo_co]
enable   = 1
host     = 127.0.0.1
port     = 80
clientid = mydeviceco@@@group-echo-co
username =
password =
keepalive = 60
timeout  = 10
