[default]
threadmax                  = 1024
threadmin                  = 5
httpport                   = 80
httpsport                  = 443
bmcport                    = 7755 ;Baseboard Management Controller
cothreadnum                = 8 ;Coroutines run on thread num

http2_enable               = 1
debug_enable               = 1
deamon_enable              = 0
ip6_listen_enable          = 1
mainhost                   = www.hggq.com
certificate_chain_file     = www.hggq.com.pem
private_key_file           = www.hggq.com.key
tmp_dh_file                = dh4096.pem
chain_crt_file             = www.hggq.com.crt
reboot_password            = e10adc3949ba59abbe56e057f20f883e ;md5(md5("123456")+"rand_char"+md5("123456"))
reboot_cron                = d180h5 ;MDSW+Hhours reboot process M month D day S season (1 4 7 10) W week
clean_cron                 = m5t600 ;5-minute interval clean 600 seconds ago inactive connection
temp_clean_time            = 86400 ;seconds(3600*24); every N seconds httpwatch scans temp folder, remove pzraw_/pzup_ files modified more than N seconds ago (60-604800)
links_restart_process      = n9998877ts1te5 ;More than 15000 connections, restart the process from 1:00 am to 5:00 am
session_type               = 1 ;session save type 0.file 1.memory 2.redis 3.memcache 4.reserve
static_file_compress_cache = 1 ;1 enable, Cache static file compress(gzip,br) content to cache directory

rate_limit_status          = 0 ; 1 enable Traffic limiting
rate_limit_new_wait_num    = 300 ; level 1, start rate-limiting at N connections
rate_limit_accept_wait_num = 600 ; level 2, maximum rate-limit severity (interpolation upper bound)
rate_limit_second_num1     = 20  ; pass per second at low load
rate_limit_second_num2     = 5   ; pass per second at high load

modelspath                 = ./models
serverpath                 = ./
viewpath                   = ./view
viewsopath                 = ./module/view

controlpath                = ./controller
controlsopath              = ./module/controller

temppath                   = ./temp
logpath                    = ./log
wwwpath                    = ./www/default
pluginspath                = ./plugins
libspath                   = ./libs
directorylist              = 1
index                      = index.html
;html cache: 带点 url 先看盘上那个文件，没过期就发文件，过期才交给同名注册路由重生成
;非空即开，关掉请注释掉整行；其余域名段可以各写一份覆盖这里
usehtmlcache               = 1
usehtmlcachetime           = 3600 ;seconds 缓存文件放多久算过期，下限 10 秒

acme_auto                  = 0 ;acme automatically applies for SSL certificates, 1 自动更新SSL证书
acme_every_day             = 7 ;What time does acme run every day, 每天几点运行一次，如果有证书需要就更新
acme_every_num             = 5 ;How many domain names are processed at a time, 每次处理几个域名
ocsp_intv_time             = 14400 ;OCSP update interval second(14400 * 5, may be set 3600), OCSP 更新时间间隔 至少4小时

staticfile_cache_num       = 0 ;0 not cache, min 10 begin
rewrite_404                = 0 ;1 file 2 action url path
rewrite_404_action         = index.html
method_pre                 = 
method_after               = 
show_visitinfo             = 0
upload_max_size            = 16777216
siteid                     = 1
groupid                    = 0
alias_domain               = 
init_func                  = 
;cors_domain CORS whitelist, comma-separated; only when the request Origin matches will the corresponding ACAO be echoed and Vary: Origin be added
;  not written / written empty  → deny by default: this site sends no CORS headers at all (logs [CORS-WARN] naming it at startup)
;  *                   → explicitly allow all cross-origin (echo * for any origin)
;  when a whitelist is written in this section, sites without their own cors_domain inherit this section's list
;  cors_expose_headers response headers that page JS is allowed to read during cross-origin, if not written the header is not sent
;  cors_domain 实际上是白名单列表，允许那些域名通行
cors_domain                =
;cors_expose_headers        = x-request-id, x-total-count
;cors_credentials whether cross-origin is allowed to carry credentials (cookie / HTTP auth); 1 or starting with T means on, default off
;  when enabled, only responses that hit the whitelist and echo a specific Origin in ACAO carry Access-Control-Allow-Credentials: true
;  sites that allow all (ACAO is *) do not send this header even if set to 1: per spec, "*"+credentials are mutually exclusive and browsers will hard-reject
;  this header only solves "allowed to carry": for cookies to be sent cross-site it must also be HTTPS, and the cookie itself must have SameSite=None
;  after setting 1 the framework will also write the session cookie as SameSite=None; Secure (HTTPS requests only; not sent in plaintext,
;  because browsers drop Secure cookies in plaintext, which would break the login state in local http dev environments)
;cors_credentials            = 0
;cors_allow_methods cross-origin methods allowed in preflight (Access-Control-Allow-Methods), comma-separated
;  not writing this line → use the framework default POST, GET, OPTIONS, QUERY (QUERY is the read-only query method of the METHOD-QUERY draft)
;  writing the whole list overrides: both the response header and the validation of Access-Control-Request-Method use this list
;  writing empty → this site's preflight allows no methods (Allow-Methods is not sent either, cross-origin write operations will be blocked by the browser)
;  comparison is case-insensitive, output is uniformly converted to uppercase
; cors_allow_methods 是OPTIONS查询返回的能力
;cors_allow_methods           = POST, GET, OPTIONS, QUERY

[www.hggq.com]
wwwpath                    = ./www/default
http2_enable               = 1
acme_auto                  = 0
;rewrite_404=1
;rewrite_404_action=index.html|psy/index.html|exam/index.html
;controlsopath=./controller
static_pre                 = downloadfileauth|upload
method_pre                 =  ;api/dev/hostcors
method_after               = 
isuse_php                  = 0
rewrite_php                = ./www/mpdftest|index.php
fastcgi_host               = 127.0.0.1 ;/run/php/php8.1-fpm.sock
fastcgi_port               = 9000
upload_max_size            = 16777216
siteid                     = 1
groupid                    = 0
alias_domain               = 
init_func                  = 
;cors_domain CORS whitelist, comma-separated; only when the request Origin matches will the corresponding ACAO be echoed and Vary: Origin be added
;  *                           allow all, echo * for any origin
;  https://www.hggq.com        if a full origin is written it is matched as-is (non-standard ports must be written in full)
;  www.hggq.com,www.hggq.net   domain only, automatically matches both http:// and https:// schemes
;  not writing this line               → inherit [default]'s whitelist; writing empty makes this site exit inheritance and deny by default
;  before entering the list: uniformly lowercase, strip trailing slash, remove default port matching the scheme (:80 / :443)
cors_domain                = www.hggq.com, www.hggq.net
;cors_expose_headers response headers that page JS is allowed to read during cross-origin (Access-Control-Expose-Headers)
;  if not written the header is not sent; list as needed, e.g.: x-request-id, x-total-count
;  writing * means expose all response headers (not recommended: internal response headers would also be exposed to page scripts)
;cors_expose_headers        =
;cors_credentials whether cross-origin is allowed to carry credentials (cookie / HTTP auth), 1 on 0 off
;  not writing this line → inherit [default]; writing 0 is this site explicitly disabling it, it will not follow [default]'s 1
;  only sent when ACAO echoes a specific Origin (whitelist hit); for mutual exclusion rules see the same-named item in the [default] section
;cors_credentials            = 0
;cors_allow_methods cross-origin methods allowed in preflight, comma-separated
;  not writing this line → inherit [default]; writing the whole list overrides this site's list (response header and preflight validation share the same source)
;  writing empty → this site's preflight allows no methods; for the default four items and other notes see the same-named item in the [default] section
;cors_allow_methods           = POST, GET, OPTIONS, QUERY