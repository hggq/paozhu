; WebSocket 长连接客户端配置
; paozhu 监听 port 80，Apache 占了 8080
; echo_ws_client / echo_ws_client_co 连本 server 已有的 /wstest echo handler（loopwebsockets）

[default]
; enable = 0 这一段名下的常驻 ws 客户端循环整段不启动（同步版与协程版共用本段，一起关）。
; 只在进程启动时读一次，改完要重启；键缺失按 1 处理。
enable   = 1
host    = 127.0.0.1
port    = 80
url     = /wstest
header  = ;"key:value\r\nkey2:value2"
isssl   = 0
sslport = 80
insecure = 0
ca_file =
sni     =
timeout = 10

groupid =
myid    =