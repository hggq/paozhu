# GitHub OAuth 客户端这一侧（libs/github + controller/src/github）的部署配置。
# 本文件**不存任何 client 凭据**：client_id / client_secret / redirect_uri 是每个 admin
# 在自己的 GitHub OAuth App 里注册的，跟着绑定表单一起落 github_account 表。
#
# crypto_key        AES-256-GCM 的 master key，用来加密 github_account.client_secret。
#                   写法是 64 个 hex 字符（解出 32 字节）。长度不对、含非 hex 字符都算没配：
#                   加载本文件不会让进程退出，但会立一枚"密钥不可用"的旗，绑定/回调/定时
#                   三处据旗拒绝服务。生成一次（在部署机上跑，不要提交进仓库）：
#                     openssl rand -hex 32
#                   换这把钥匙要重加密已有的每一行 client_secret，否则老绑定全部解不开。
#                   文件权限按 conf/oauth_rsa_private.pem 那一档（600），由部署脚本负责。
#
# api_base          调 GitHub API 的根（GET /user、GET /user/repos、DELETE /applications/…）。
# auth_base         浏览器 302 出去的根（/login/oauth/authorize、/login/oauth/access_token）。
#                   两个值必须以 https:// 开头，否则读的时候整段回落默认值——client_secret
#                   和令牌就是从这两条口出去的，写成 http 等于明文上网。
#
# sync_interval     间隔任务每一拍多少秒，也是注册进任务表的那个数。留空用 CONST_GH_SYNC_INTERVAL。
# sync_batch        每一拍最多处理多少个账号（同一拍串行跑，不是并发）。
# sync_max_pages    每个账号每一轮最多翻多少页仓库。被这个上限截断的一轮不做软删对比。
# sync_backoff_max  连续失败后 next_sync_time 的指数退避封顶（秒）。
# http_timeout      出站 HTTP 超时（秒）。框架内部钳在 90，写更大的值不会生效。
# secret_max_len    client_secret **明文**长度闸，入口拒。落库的是密文，比明文长 28 字节
#                   （12 IV + 16 tag），列宽 varbinary(255)，两把闸分别校验。
# default_scopes    申请的 scope，逗号分隔。发授权请求前换成空格再整体 url_encode。
#                   read:user 由代码强制附加，不靠这一行；把它删掉也还是会带上，
#                   否则 GET /user 回 403，绑定行上的身份三列永远填不上。
# state_ttl         state 票据有效期（秒），必须严格大于 GitHub 那枚 code 的 600 秒。
#
# --- 默认 OAuth App （quickbind 一键授权入口用） ---
# default_client_id       GitHub OAuth App 的 client_id
# default_client_secret   GitHub OAuth App 的 client_secret
# default_redirect_uri    必须与 GitHub OAuth App 里注册的 Authorization callback URL 逐字节一致
# 三键同时非空 + crypto_key 可用 → 页面显示 "Quick bind" 按钮；缺一不可就不显示。
# 这组凭据只被 quickbind 这一条路由用到，原有 POST 表单路径完全不受影响——两条共存。
[github]
crypto_key = 8e80dfd986155430d2cf638bf3e2d8c20d287b0a99d8fe32b3b469df9fc8df89
api_base = https://api.github.com
auth_base = https://github.com
sync_interval = 900
sync_batch = 5
sync_max_pages = 3
sync_backoff_max = 3600
http_timeout = 8
secret_max_len = 128
default_scopes = repo,read:user
state_ttl = 900
; --- (演示) 默认 OAuth App 三键，填好 quickbind 按钮才出现，下面是虚假的数据，需要去 https://github.com/settings/developers 申请  ---
default_client_id = Ov23li98gp47ujnemKCA
default_client_secret = 32b1581c8a6ff1c70fe1ca76fd75fabb4c4b369e
default_redirect_uri = https://www.hggq.com/github/callback
