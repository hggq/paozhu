; pzredis 连接配置
; 段名即连接名，业务侧用 pz::redis::redis_conf("段名") / get_redis_pool().async_exec("段名", ...) 取
; 字段：host port username password dbindex isssl insecure sni ca_file timeout prefix maxpool
; sni：isssl = 1 时握手上报的域名（服务端按它选证书），证书主机名也按它校验；
;      留空 = 不上报 SNI（与老版本一致），主机名校验退回用 host

[default]
; enable = 0 只关掉"用本段名当连接名的常驻订阅任务"（section_name() = default 的那几条），
; 进程启动时读一次，改完要重启；键缺失按 1 处理。连接池和本段的其它字段都不看它，
; 业务侧的 redis_conf("default") 调用照旧。
enable   = 1
host     = 127.0.0.1
port     = 6379
username =
password =
dbindex  = 0
isssl    = 0
sslport  = 6379
insecure = 0
ca_file  =
sni      =
timeout  = 3
prefix   =
maxpool  = 128

[client1]
host     = 127.0.0.1
port     = 6379
username =
password =
dbindex  = 0
isssl    = 0
sslport  = 6379
insecure = 0
ca_file  =
sni      =
timeout  = 3
; prefix 由连接层按 kKeyPositions 加在"确知是 key 的参数位"上，业务侧写的是裸键名。
; 这一段是演示/判据用的，[default] 不带前缀。
prefix   = pzpre:
maxpool  = 128
