# OAuth 2.1 授权服务器（libs/oauth + controller/src/oauth）的部署配置。
# 每次请求现读本文件和下面两个密钥文件，改完不用重启 bin/paozhu。
#
# issuer            token 里的 iss，也是元数据端点里的 issuer。必须与对外访问地址逐字符一致：
#                   含 scheme、非默认端口要写、结尾不带 '/'（多余的 '/' 读进来时会被截掉）。
# kid               JWT 头与 /oauth/jwks 里那一枚密钥的 id。换密钥时连这里一起改。
# private_key_file  RS256 私钥，PKCS#8 PEM（"-----BEGIN PRIVATE KEY-----"）。
# public_key_file   RS256 公钥，必须是 "-----BEGIN PUBLIC KEY-----" 那种 —— 验签只认这个格式，
#                   "BEGIN RSA PUBLIC KEY"（PKCS#1）读不出来。
#
# 路径口径与 server.conf 的 certificate_chain_file 相同：相对路径按本文件所在目录拼，
# 绝对路径原样使用；留空回落到编译期默认 oauth_rsa_private.pem / oauth_rsa_public.pem。
# 两个文件缺任何一个、或超过 64 KB，签发与验签一律失败（端点回 500 server_error），
# 不会降级到对称算法。
#
# 生成一次密钥（在部署机上跑，私钥不要提交进仓库）：
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out conf/oauth_rsa_private.pem
#   openssl pkey -in conf/oauth_rsa_private.pem -pubout -out conf/oauth_rsa_public.pem
#
# refresh_ttl   轮换后新 refresh token 的有效期（秒）。留空或整行不写＝用编译期默认
#               CONST_OAUTH_REFRESH_TTL（2592000＝30 天）。必须是纯数字，且小于清理保留期
#               CONST_OAUTH_PURGE_KEEP（7776000＝90 天）——refresh 活得比保留久，那行 revoked
#               记录会在它到期之前被清掉，重放检测就没有依据了。越界或非数字这一行不生效，
#               启动日志打一行 "[oauth] refresh_ttl ignored: ..."，仍然按默认值走。
#               注意它是"闲置期"：每次用 refresh 换新令牌都会重新计时，持续使用就一直在续。
#
# 令牌里 access 的 900 秒、授权码的 300 秒、清理节拍与保留期仍是编译期常量，在 common/cost_define.h。
[oauth]
issuer = https://www.hggq.com
kid = oauth-rs256-1
private_key_file = oauth_rsa_private.pem
public_key_file = oauth_rsa_public.pem
refresh_ttl = 2592000
