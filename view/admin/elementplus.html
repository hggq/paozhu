<div class="page-card">
    <div class="page-title">📊 仪表盘 <span style="font-size:14px;font-weight:400;color:#8a9aaa;">Element Plus 示例</span></div>
    <div id="vue-app">
        <!-- 按钮 -->
        <el-button type="primary" @click="handleClick">主要按钮</el-button>
        <el-button @click="handleClick">默认按钮</el-button>
        <el-button type="success" @click="handleClick">成功按钮</el-button>

        <!-- 输入框 -->
        <div style="margin: 16px 0;">
            <el-input v-model="inputText" placeholder="请输入内容" style="width: 300px;"></el-input>
            <div style="margin-left: 12px; display: inline-block;">输入内容：{{ inputText }}</div>
        </div>

        <!-- 表格 -->
        <el-table :data="tableData" style="width: 100%; margin-top: 16px;" border>
            <el-table-column prop="date" label="日期" min-width="180"></el-table-column>
            <el-table-column prop="name" label="姓名" min-width="180"></el-table-column>
            <el-table-column prop="address" label="地址" min-width="180"></el-table-column>
        </el-table>

        <!-- 弹窗演示 -->
        <el-button type="danger" @click="dialogVisible = true">打开弹窗</el-button>
        <el-dialog v-model="dialogVisible" title="提示" width="30%">
            <span>这是一个 Element Plus 弹窗</span>
            <template #footer>
                <span class="dialog-footer">
                    <el-button @click="dialogVisible = false">取消</el-button>
                    <el-button type="primary" @click="dialogVisible = false">确认</el-button>
                </span>
            </template>
        </el-dialog>
    </div>
</div>

<script data-vue>
{
    setup() {
        const inputText = Vue.ref('');
        const dialogVisible = Vue.ref(false);
        const tableData = Vue.ref([]);
        const loading = Vue.ref(true);

        const handleClick = () => {
            alert('按钮点击！');
        };

        // 从接口获取数据
        const fetchData = async () => {
            loading.value = true;
            try {
                const res = await fetch('/admin/testgetjson');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                // 假设返回的 JSON 格式是 [{ date, name, address }, ...]
                // 如果字段名不同，请在此映射
                tableData.value = data;
            } catch (e) {
                console.error('加载表格数据失败:', e);
                tableData.value = [];
            } finally {
                loading.value = false;
            }
        };

        // 组件挂载时自动请求
        Vue.onMounted(fetchData);

        // 调试：监听输入变化
        Vue.watch(inputText, (newVal) => {
            console.log('输入内容:', newVal);
        });

        return {
            inputText,
            dialogVisible,
            tableData,
            loading,
            handleClick
        };
    }
}
</script>
